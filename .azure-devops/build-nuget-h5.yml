variables:
  buildConfiguration: 'Release'

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - Tesserae.Flint/*
      - Tesserae.Flint.Sample/*
      - packages/flint-js/*
      - .azure-devops/build-nuget-h5.yml

pool:
  vmImage: 'windows-latest'

steps:
- checkout: self
  submodules: true
  persistCredentials: true

- task: PowerShell@2
  displayName: 'Create CalVer Version'
  inputs:
    targetType: 'inline'
    script: |
      $dottedDate = (Get-Date).ToString("yy.M")
      $buildID = $($env:BUILD_BUILDID)
      $modBuildID = [int]$buildID % 65536  # ensure fits in int16
      $newTargetVersion = "$dottedDate.$modBuildID"
      Write-Host "##vso[task.setvariable variable=targetVersion;]$newTargetVersion"
      Write-Host "Updated targetVersion to '$newTargetVersion'"

- task: UseDotNet@2
  displayName: 'Use .NET 10.0 sdk'
  inputs:
    packageType: sdk
    version: 10.x
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: NodeTool@0
  displayName: 'Use Node.js 22.x'
  inputs:
    versionSpec: '22.x'

- task: NuGetToolInstaller@1

- task: CmdLine@2
  displayName: 'install h5 compiler'
  inputs:
    script: 'dotnet tool update --global h5-compiler'

# Bundle flint-chart (packages/flint-js) plus the vendored renderer runtimes
# into the browser-global JS that the H5 project embeds (also runs as an
# MSBuild target during the build, but doing it explicitly here makes the
# produced artifact visible in the build logs).
- task: CmdLine@2
  displayName: 'bundle flint js'
  inputs:
    script: |
      npm install --no-audit --no-fund
      npm run bundle
    workingDirectory: '$(Build.SourcesDirectory)/Tesserae.Flint/'

- task: CmdLine@2
  displayName: 'test bundle + spec compilation'
  inputs:
    script: 'npm test'
    workingDirectory: '$(Build.SourcesDirectory)/Tesserae.Flint/'

- task: CmdLine@2
  displayName: 'restore Tesserae.Flint project'
  inputs:
    script: 'dotnet restore $(Build.SourcesDirectory)\Tesserae.Flint\Tesserae.Flint.csproj'
    workingDirectory: '$(Build.SourcesDirectory)/Tesserae.Flint/'

- task: CmdLine@2
  displayName: 'Build Tesserae.Flint'
  inputs:
    script: 'dotnet build $(Build.SourcesDirectory)\Tesserae.Flint\Tesserae.Flint.csproj -c $(buildConfiguration) /p:Version=$(targetVersion)'
    workingDirectory: '$(Build.SourcesDirectory)/Tesserae.Flint/'

- task: CmdLine@2
  inputs:
    script: 'dir $(Build.SourcesDirectory)\Tesserae.Flint\bin\ /S'

# NOTE: The service connection / feed name below mirrors curiosity-ai/graph-kit's
# pipeline; Rafael will adjust the actual service connection when wiring up the
# Azure DevOps pipeline for this repo.
- task: NuGetCommand@2
  displayName: 'push Tesserae.Flint to nuget'
  inputs:
    command: 'push'
    packagesToPush: '**/*/Tesserae.Flint.$(targetVersion).nupkg' # The package name comes from the PackageID, not project name
    nuGetFeedType: 'external'
    publishFeedCredentials: 'nuget-curiosity-org'
